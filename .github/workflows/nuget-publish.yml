name: Publish NuGet Package

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    permissions: 
      id-token: write
          
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏗️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: 🔄 Restore
        run: dotnet restore

      - name: 🏗️ Build
        run: dotnet build -c Release /p:PackageVersion=1.0.${{ github.run_number }}

      - name: 🛠️ Pack
        run: dotnet pack -c Release /p:PackageVersion=1.0.${{ github.run_number }} --output ./nupkgs
      
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
          
      - name: 🚀 Push to NuGet
        run: dotnet nuget push ./nupkgs/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
