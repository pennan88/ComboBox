name: Publish NuGet Package

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    permissions: 
      id-token: write
          
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏗️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: 🔄 Restore
        run: dotnet restore

      # Runs up to 45 published 1.1.<run> (last: 1.1.45, which shipped the Dropdown 2.0 features).
      # The 1.2 line starts at run 46 (1.2.0); every later push to main gets the next patch number.
      # For the next minor, change the prefix and set the offset to the run number it starts at.
      - name: 🔢 Version
        run: echo "PACKAGE_VERSION=1.2.$(( ${{ github.run_number }} - 46 ))" >> "$GITHUB_ENV"

      - name: 🏗️ Build
        run: dotnet build -c Release /p:PackageVersion=${{ env.PACKAGE_VERSION }}

      - name: 🧪 Test
        run: dotnet test Tests/ComboBox.Tests.csproj -c Release --no-build

      - name: 🛠️ Pack
        run: dotnet pack -c Release /p:PackageVersion=${{ env.PACKAGE_VERSION }} --output ./nupkgs
      
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
          
      - name: 🚀 Push to NuGet
        run: dotnet nuget push ./nupkgs/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
